<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body style="background-color: #5ce47e6a;">
    <div class="container calculatebody d-flex flex-column justify-content-center align-items-center border mt-5 mb-4 bg-primary-subtle shadow border-light-subtle p-5 " style="min-height: 400px; max-width:1000px; width: 100%;">
        <h1 class="heading mb-0 bg-primary-subtle p-2 rounded-2 ">BMI Calculator</h1>
        <h6 class="tagline mb-3">Metric units</h6>

        <!-- Height and weight -->
        <form class="container" style="max-width: 650px;">
        <div class="row g-3">

            <!-- Height -->
        <div class="col-12 col-md-6">
        <div class="row g-2 align-items-center">
                <label for="height" class="col-3 col-form-label">Height:</label>
                <div class="col">
                <input type="number" id="height" class="form-control" placeholder="in cm" min="50" max="250" required>
                </div>
        </div>
        </div>

    <!-- Weight -->
        <div class="col-12 col-md-6">
        <div class="row g-2 align-items-center">
                <label for="weight" class="col-3 col-form-label">Weight:</label>
                <div class="col">
                <input type="number" id="weight" class="form-control" placeholder="in kg" min="10" max="250" required>
                </div>
        </div>
        </div>
<!-- AGe and Gender -->
        <div class="col-12 col-md-6">
            <div class="row g-2 align-items-center">
                    <label for="Age" class="col-form-label col-3">Age:</label>
                    <div class="col">
                    <input type="number" id="Age" class="form-control" placeholder="5-100" min="5" max="150" required>
                    </div>
            </div>
        </div>
        <!-- Gender -->
        <div class="col-12 col-md-6">
           <div class="row align-items-center g-2">
                <label for="Gender" class="col-3 col-form-label">Gender:</label>
               <div class="col">
                    <select id="gender" class="form-select" required>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
               </div>
           </div>
        </div>
        <div class="button col-12 d-flex justify-content-center gap-3 align-items-center">
            <button type="reset" id="formclear" class="btn px-4 btn-warning rounded-3">Reset</button>
            <button type="submit" id="formsubmit" class="btn px-4 btn-success  rounded-3">Submit</button>
        </div>
  </form>


<div id="resultCard" class="mx-auto card mt-4 p-3 border-0 bg-white shadow-sm text-center justify-content-center" style="width: 100%; max-width: 320px;">
  <h4 class="text-black   mb-1 ">Your Result</h4>
  
  <div class="text-dark" id="bmiValue" style="font-size: 20px;"></div>
  <div>
    <p class=" rounded px-3 py-2 font-bold" id="bmiCategory" style="font-size: 20px;">Enter Details</p>
  </div>
</div>
<!-- // Remarks -->
<div class="p-5 my-5 bg-white mx-auto shadow rounded-2" style="max-width: 600px; width: 100%;">
<h4 class="text-center text-black fw-bold">Remarks</h4>
<p id="bmiexplaination" style="font-size: 18px;" class="text-center">Waiting for User input</p>
</div>

    </div>   
    <script src="./main.js"></script> 
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>     
</body>
</html>
